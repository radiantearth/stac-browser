<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="./" id="stac-browser-base" />
    <title>eox-itemfilter OSC Search</title>
    <!-- ESA Custom Fonts -->
    <link rel="stylesheet" href="css/notesesabold.css" />
    <script type="module" src="eox/eox-itemfilter.js"></script>
    <script type="module" src="eox/eox-map.js"></script>
    <script type="module" src="eox/eox-timecontrol.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f0f2f5;
        height: 100dvh;
        overflow: hidden;
      }
      .search-layout-container {
        display: flex;
        flex-direction: row;
        width: 100%;
        max-width: calc(1400px + 4rem);
        margin: 0 auto;
        padding: 0 2rem;
        box-sizing: border-box;
        height: 100dvh;
        overflow: hidden;
      }
      @media (max-width: 45em) {
        .search-layout-container {
          max-width: calc(1400px + 3rem);
          padding: 0 1.5rem;
        }
      }
      .sidebar {
        width: 350px;
        min-width: 350px;
        height: 100dvh;
        background: white;
        border-right: 1px solid #ddd;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 20px;
        box-sizing: border-box;
        transition: transform 0.3s ease-in-out;
        z-index: 100;
      }
      .main-content {
        flex-grow: 1;
        height: 100dvh;
        overflow-y: auto;
        padding: 20px;
        box-sizing: border-box;
        position: relative;
      }
      .sidebar-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 1rem;
      }
      .sidebar-header h1 .mobile-only {
        display: none;
      }
      @media (max-width: 768px) {
        body {
          overflow: visible;
          height: auto;
        }
        .search-layout-container {
          flex-direction: column;
          height: auto;
          overflow: visible;
          padding: 0;
        }
        .sidebar {
          display: block;
          position: sticky;
          top: 0;
          z-index: 110;
          width: 100%;
          min-width: 100%;
          height: auto;
          transform: none;
          border-right: none;
          border-bottom: 1px solid #ddd;
          padding: 10px;
          overflow: visible;
          background: white;
          box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .main-content {
          padding-top: 10px;
          height: auto;
          overflow-y: visible;
        }
        .sidebar-header {
          display: block;
          margin-bottom: 8px;
        }
        .sidebar-header h1 {
          font-size: 1.2rem;
        }
        .sidebar-header h1 .mobile-only {
          display: inline;
        }
        #results {
          grid-template-columns: 1fr;
        }
        eox-itemfilter {
          display: flex !important;
          flex-wrap: wrap !important;
          flex-direction: row !important;
          height: auto !important;
          flex: none !important;
          opacity: 1 !important;
          transition: none !important;
          width: 100% !important;
        }
        .sidebar [slot="filterstitle"] {
          display: none;
        }
      }
      .sidebar [slot="filterstitle"] {
        display: flex;
        align-items: center;
        height: calc(32px + 1rem);
      }
      .sidebar [slot="filterstitle"] p {
        line-height: 32px;
        font-size: 1rem;
        margin: 0;
      }
      #status {
        margin-bottom: 1rem;
        color: #335e6f;
        font-size: 0.9rem;
      }
      h1 {
        font-family: "NotesESAbold", sans-serif !important;
        color: #003247;
        margin: 0;
        font-size: 2rem;
      }
      eox-itemfilter {
        flex: 1;
        display: flex;
        flex-direction: column;
        border: none;
        --eox-body-font-family: Arial, sans-serif;
        --padding: 0 !important;
        --list-padding: 0.5rem;
        opacity: 0;
        transition: opacity 0.2s;
      }
      eox-itemfilter.ready {
        opacity: 1;
      }
      #results {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 8px;
      }
      .card {
        background: white;
        border-radius: 4px;
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: transform 0.2s;
        border: 1px solid rgba(0, 0, 0, 0.125);
      }
      .card:hover .card-title {
        text-decoration: underline;
      }
      .card-content {
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        gap: 12px;
      }
      .card-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .chip {
        border: 1px solid #003247;
        color: #003247;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 10px;
        white-space: nowrap;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card-title {
        font-family: "NotesESAbold", sans-serif;
        font-size: 1.2rem;
        font-weight: bold;
        color: #003247;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin: 0;
        line-height: 1.2;
      }
      .card-description {
        font-size: 0.9em;
        line-height: 1.4;
        color: #444;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin: 0;
      }
      .card-date {
        font-size: small;
        color: #335e6f;
        margin-top: auto;
      }

      /* --- LOADING OVERLAY --- */
      .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      .loading-overlay.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(0, 50, 71, 0.1);
        border-radius: 50%;
        border-top-color: #003247;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
      <div class="loading-spinner"></div>
    </div>

    <div class="search-layout-container">
      <div class="sidebar">
        <div class="sidebar-header">
          <h1>
            Search <span class="mobile-only">Products & Workflows</span>
          </h1>
        </div>
        <eox-itemfilter id="itemfilter">
          <div slot="filterstitle">
            <p><strong>Products & Workflows</strong></p>
          </div>
        </eox-itemfilter>
      </div>
      <div class="main-content">
        <div id="status"></div>
        <div id="results"></div>
      </div>
    </div>

    <script type="module">
      let safetyTimeout;
      const hideLoader = () => {
        if (safetyTimeout) {
          clearTimeout(safetyTimeout);
          safetyTimeout = null;
        }
        const loadingOverlay = document.getElementById("loading-overlay");
        if (loadingOverlay) {
          loadingOverlay.classList.add("fade-out");
          setTimeout(() => {
            loadingOverlay.remove();
          }, 400);
        }
      };

      const itemFilterEl = document.querySelector("#itemfilter");
      const resultsEl = document.querySelector("#results");
      const statusEl = document.querySelector("#status");
      const mainContent = document.querySelector(".main-content");

      const urlParams = new URLSearchParams(window.location.search);

      const BASE_URL =
        urlParams.get("baseUrl") ||
        "https://esa-earthcode.github.io/open-science-catalog-metadata";
      const API_URL =
        urlParams.get("apiUrl") ||
        "https://eoapi.workspace.earthcode.eox.at/stac";
      let productBaseUrl =
        urlParams.get("productBaseUrl") ||
        urlParams.get("siteUrl") ||
        "https://opensciencedata.esa.int/";
      if (!productBaseUrl.endsWith("/")) {
        productBaseUrl += "/";
      }

      const CATEGORY_CONFIG = [
        { key: "themes", path: "themes", title: "Themes", prefix: "theme_" },
        {
          key: "variables",
          path: "variables",
          title: "Variables",
          prefix: "variable_",
        },
        {
          key: "missions",
          path: "eo-missions",
          title: "EO Missions",
          prefix: "eo-mission_",
        },
        {
          key: "projects",
          path: "projects",
          title: "Projects",
          prefix: "project_",
        },
      ];

      let nextUrl = null;
      let lastUrl = null;
      let currentQueryUrl = null;
      let isLoading = false;
      let filterData = {};

      /**
       * Fetches catalog children for a given path
       */
      const fetchCatalogItems = async (path) => {
        try {
          const response = await fetch(`${BASE_URL}/${path}/catalog.json`);
          if (!response.ok) throw new Error(`Failed to fetch ${path}`);
          const { links } = await response.json();
          return links
            .filter((l) => l.rel === "child")
            .map((l) => ({ id: l.href.split("/").at(-2), title: l.title }));
        } catch (error) {
          console.error(error);
          return [];
        }
      };

      /**
       * Fetches all collections from the STAC API to extract active keywords
       */
      const fetchActiveKeywords = async () => {
        const activeKeywords = new Set();
        let url = `${API_URL}/collections?limit=1000`;
        while (url) {
          try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Failed to fetch collections from ${url}`);
            const data = await response.json();
            for (const c of data.collections || []) {
              for (const kw of c.keywords || []) {
                activeKeywords.add(kw);
              }
            }
            const nextLink = data.links?.find((l) => l.rel === "next");
            url = nextLink ? nextLink.href : null;
          } catch (error) {
            console.error("Error fetching active keywords:", error);
            break;
          }
        }
        return activeKeywords;
      };

      /**
       * Formats a date string to a human-readable format
       */
      const formatDate = (dateString) => {
        if (!dateString) return "present";
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return "..";
        return (
          date.toLocaleString("en-US", {
            year: "numeric",
            month: "numeric",
            day: "numeric",
            hour: "numeric",
            minute: "2-digit",
            second: "2-digit",
            hour12: true,
            timeZone: "UTC",
          }) + " UTC"
        );
      };

      /**
       * Renders a single collection item as an HTML string
       */
      const renderItem = (item) => {
        const isWorkflow = (item.keywords || []).some(
          (kw) => kw.toLowerCase() === "workflow"
        );
        let relativePath = isWorkflow
          ? `workflows/${item.id}/record`
          : `products/${item.id}/collection`;
        const canonicalLink = item.links?.find((l) => l.rel === "canonical");
        if (canonicalLink && canonicalLink.href) {
          const match = canonicalLink.href.match(
            /\/([^\/]+\/[^\/]+\/(collection|record))(\.json)?$/
          );
          if (match) {
            relativePath = match[1];
          }
        }
        return `
          <a class="card" href="${productBaseUrl}${relativePath}" target="_parent">
            <div class="card-content">
              <div class="card-title" title="${item.title}">${item.title}</div>
              <p class="card-description" title="${item.description || ""}">
                ${item.description || ""}
              </p>
              ${
                item.filteredKeywords?.length
                  ? `
                <div class="card-tags">
                  ${item.filteredKeywords
                    .slice(0, 8)
                    .map((kw) => `<span class="chip" title="${kw}">${kw}</span>`)
                    .join("")}
                </div>
              `
                  : ""
              }
              ${
                item.dateRange
                  ? `<div class="card-date">${item.dateRange}</div>`
                  : ""
              }
            </div>
          </a>
        `;
      };

      /**
       * Formats raw collection items for rendering
       */
      const formatItems = (collections = []) =>
        collections.map((c) => {
          const interval = c.extent?.temporal?.interval?.[0];
          const hasDate = interval && (interval[0] || interval[1]);
          return {
            ...c,
            dateRange: hasDate
              ? interval.map((d) => formatDate(d)).join(" – ")
              : "",
            filteredKeywords: (c.keywords || []).filter(
              (kw) =>
                !CATEGORY_CONFIG.some((config) => kw.startsWith(config.prefix))
            ),
          };
        });

      /**
       * Loads next page of results when scrolling
       */
      const handleScroll = async () => {
        if (isLoading || !nextUrl) return;

        let scrollTop, clientHeight, scrollHeight;
        if (window.innerWidth <= 768) {
          scrollTop = window.scrollY || document.documentElement.scrollTop;
          clientHeight = window.innerHeight;
          scrollHeight = document.documentElement.scrollHeight;
        } else {
          ({ scrollTop, clientHeight, scrollHeight } = mainContent);
        }

        if (scrollTop + clientHeight >= scrollHeight - 100) {
          isLoading = true;
          try {
            const response = await fetch(nextUrl);
            const { collections, links } = await response.json();
            nextUrl = links?.find((l) => l.rel === "next")?.href;
            const items = formatItems(collections);
            resultsEl.insertAdjacentHTML(
              "beforeend",
              items.map(renderItem).join("")
            );
          } catch (error) {
            console.error("Error loading more items:", error);
          } finally {
            isLoading = false;
          }
        }
      };

      /**
       * Checks if the main content has scroll/overflow to enable scroll lazy loading
       */
      const hasScrollbar = () => {
        if (window.innerWidth <= 768) {
          return document.documentElement.scrollHeight > window.innerHeight;
        } else {
          return mainContent.scrollHeight > mainContent.clientHeight;
        }
      };

      /**
       * Fills the page with items until a scrollbar appears or no more items are available
       */
      const fillPageWithItems = async (queryUrl) => {
        // While there is no scrollbar, there is a next page, we aren't already loading,
        // and the query URL is still the active one:
        while (
          !hasScrollbar() &&
          nextUrl &&
          !isLoading &&
          queryUrl === currentQueryUrl
        ) {
          isLoading = true;
          try {
            const response = await fetch(nextUrl);
            if (queryUrl !== currentQueryUrl) break;
            const { collections, links } = await response.json();
            if (queryUrl !== currentQueryUrl) break;
            nextUrl = links?.find((l) => l.rel === "next")?.href;
            const items = formatItems(collections);
            resultsEl.insertAdjacentHTML(
              "beforeend",
              items.map(renderItem).join("")
            );
            // Wait for next frame so the browser can calculate styles and layout
            await new Promise((resolve) => requestAnimationFrame(resolve));
          } catch (error) {
            console.error("Error filling page with items:", error);
            break;
          } finally {
            isLoading = false;
          }
        }
      };

      /**
       * Generates CQL filters for text search
       */
      const getCqlTextFilters = (text, fields) => {
        if (!text) return "";
        const esc = text.replace(/'/g, "''");
        const variations = [
          ...new Set([
            esc,
            esc.toLowerCase(),
            esc.charAt(0).toUpperCase() + esc.slice(1),
          ]),
        ];
        const fieldFilters = fields.flatMap((f) =>
          variations.map((v) => `${f} LIKE '%${v}%'`)
        );
        return `(${fieldFilters.join(" OR ")})`;
      };

      /**
       * Initialization
       */
      const init = async () => {
        safetyTimeout = setTimeout(hideLoader, 8000);

        const dataPromise = Promise.all(
          CATEGORY_CONFIG.map((config) => fetchCatalogItems(config.path))
        );
        const activeKeywordsPromise = fetchActiveKeywords();
        await customElements.whenDefined("eox-itemfilter");

        const [data, activeKeywords] = await Promise.all([
          dataPromise,
          activeKeywordsPromise,
        ]);

        CATEGORY_CONFIG.forEach((config, i) => {
          let items = data[i];
          if (activeKeywords && activeKeywords.size > 0) {
            items = items.filter((item) =>
              activeKeywords.has(`${config.prefix}${item.id}`)
            );
          }
          items.sort((a, b) => {
            const titleA = a.title || "";
            const titleB = b.title || "";
            return titleA.localeCompare(titleB, "en", { sensitivity: "base" });
          });
          filterData[config.key] = items;
        });

        const isMobile = window.innerWidth <= 768;
        if (isMobile) itemFilterEl.setAttribute("inline-mode", "");

        const today = new Date().toISOString().split("T")[0];

        Object.assign(itemFilterEl, {
          titleProperty: "title",
          showResults: false,
          inlineMode: isMobile,
          filterProperties: [
            {
              keys: ["title", "description", "keywords"],
              title: "Freetext search",
              type: "text",
              placeholder: "Search in titles, descriptions and keywords",
              expanded: true,
            },
            ...CATEGORY_CONFIG.map((config) => ({
              key: config.key,
              title: config.title,
              type: "multiselect",
              filterKeys: filterData[config.key].map((d) => d.title),
            })),
            {
              keys: ["keywords"],
              title: "Keywords",
              type: "text",
              placeholder: "Search for keywords",
            },
            {
              key: "datetime",
              title: "Date Range",
              type: "range",
              format: "date",
              min: "1958-01-01",
              max: today,
              initDate: ["1958-01-01", today],
              state: {
                min: "1958-01-01",
                max: today,
              },
            },
            {
              key: "geometry",
              title: "Area of Interest",
              type: "spatial",
              dirty: false,
              state: { mode: "intersects" },
            },
            {
              key: "osc:type",
              title: "Type",
              type: "multiselect",
              filterKeys: ["Product", "Workflow"],
            },
          ],
        });
        itemFilterEl.classList.add("ready");

        itemFilterEl.externalFilter = (input, filters) => {
          const params = new URLSearchParams();
          const cql = [];

          // Text Search
          const text = filters["title|description|keywords"]?.stringifiedState;
          const textCql = getCqlTextFilters(text, [
            "title",
            "description",
            "keywords",
          ]);
          if (textCql) cql.push(textCql);

          // Keywords Filter
          const kwText = filters["keywords"]?.stringifiedState;
          if (kwText) {
            cql.push(`keywords LIKE '%${kwText}%'`);
          }

          // Type Filter (Product or Workflow)
          const typeState = filters["osc:type"]?.state || {};
          const selectedTypes = Object.entries(typeState)
            .filter(([_, s]) => s)
            .map(([t, _]) => t.toLowerCase());

          if (selectedTypes.length === 1) {
            cql.push(`keywords LIKE '%${selectedTypes[0]}%'`);
          }

          // Categories (themes, variables, etc.)
          CATEGORY_CONFIG.forEach(({ key, prefix }) => {
            const selected = Object.entries(filters[key]?.state || {})
              .filter(([_, s]) => s)
              .map(([t, _]) => {
                const item = filterData[key].find((d) => d.title === t);
                return `keywords LIKE '%${prefix}${item?.id || t}%'`;
              });
            if (selected.length > 0) {
              cql.push(`(${selected.join(" OR ")})`);
            }
          });

          // Spatial Filter
          const spat = filters["geometry"]?.state;
          if (spat) {
            let bbox = Array.isArray(spat) ? spat : null;
            let geom =
              spat.geometry ||
              (["Polygon", "Feature"].includes(spat.type) ? spat : null);
            if (geom?.type === "Feature") geom = geom.geometry;

            if (!bbox && geom?.coordinates) {
              const flatCoords = geom.coordinates.flat(Infinity);
              const lons = flatCoords.filter((_, idx) => idx % 2 === 0);
              const lats = flatCoords.filter((_, idx) => idx % 2 === 1);
              bbox = [
                Math.min(...lons),
                Math.min(...lats),
                Math.max(...lons),
                Math.max(...lats),
              ];
            }

            if (
              (spat.mode || "intersects") === "within" &&
              geom?.type === "Polygon"
            ) {
              cql.push(
                `S_WITHIN(geometry, POLYGON((${geom.coordinates[0]
                  .map((c) => c.join(" "))
                  .join(", ")})))`
              );
            } else if (bbox) {
              params.set("bbox", bbox.map((v) => v.toFixed(4)).join(","));
            }
          }

          // Temporal Filter
          const temp = filters["datetime"]?.state;
          if (
            temp &&
            ((temp.min !== undefined && temp.min !== null) ||
              (temp.max !== undefined && temp.max !== null))
          ) {
            const iso = (v) => (v ? new Date(v).toISOString() : "..");
            params.set("datetime", `${iso(temp.min)}/${iso(temp.max)}`);
          }

          if (cql.length) {
            params.set("filter", cql.join(" AND "));
            params.set("filter-lang", "cql2-text");
          }

          // Get 20 items per page so also large screens have scroll
          params.set("limit", 20);

          const url = `${API_URL}/collections?${params}`;
          if (url === lastUrl) return { url, fetchFn: () => {} };
          lastUrl = url;
          currentQueryUrl = url;
          nextUrl = null;

          return {
            url,
            fetchFn: async (u) => {
              try {
                const response = await fetch(u);
                if (url !== currentQueryUrl) return [];
                const { collections, links, numberMatched } =
                  await response.json();
                if (url !== currentQueryUrl) return [];
                nextUrl = links?.find((l) => l.rel === "next")?.href;
                const items = formatItems(collections);

                statusEl.textContent =
                  numberMatched !== undefined ? `${numberMatched} results` : "";
                resultsEl.innerHTML = items.map(renderItem).join("");

                await fillPageWithItems(url);
                return items;
              } catch (error) {
                console.error("Error fetching collections:", error);
                statusEl.textContent = "Error loading results";
                return [];
              } finally {
                if (url === currentQueryUrl) {
                  hideLoader();
                }
              }
            },
          };
        };

        itemFilterEl.items = [];
        const updateInlineMode = () => {
          const isMobile = window.innerWidth <= 768;
          itemFilterEl.inlineMode = isMobile;
          if (isMobile) {
            itemFilterEl.setAttribute("inline-mode", "");
          } else {
            itemFilterEl.removeAttribute("inline-mode");
          }
        };
        let resizeTimeout;
        const handleResize = () => {
          updateInlineMode();
          clearTimeout(resizeTimeout);
          resizeTimeout = setTimeout(() => {
            if (currentQueryUrl) {
              fillPageWithItems(currentQueryUrl);
            }
          }, 150);
        };
        updateInlineMode();
        window.addEventListener("resize", handleResize);
        window.addEventListener("scroll", handleScroll);
        mainContent.addEventListener("scroll", handleScroll);

        itemFilterEl.addEventListener("filter", () => {
          // No longer needed to close sidebar on mobile as it's inline
        });
      };

      init();
    </script>
  </body>
</html>
