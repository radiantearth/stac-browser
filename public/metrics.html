<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="./" id="stac-browser-base" />
    <title>OSC Metrics Dashboard</title>
    <link rel="stylesheet" href="css/materialdesignicons.min.css" />
    <!-- ESA Custom Fonts -->
    <link rel="stylesheet" href="css/notesesabold.css" />

    <!-- EOxElements -->
    <script type="module" src="eox/eox-itemfilter.js"></script>
    <script type="module" src="eox/eox-map.js"></script>
    <script
      type="module"
      src="eox/eox-map-advanced-layers-and-sources.js"
    ></script>
    <script type="module" src="eox/eox-timecontrol.js"></script>
    <script type="module" src="eox/eox-chart.js"></script>

    <style>
      /* --- EXACT COLOR AND DESIGN TOKENS --- */
      :root {
        --primary-color: #003247; /* ESA Deep Blue */
        --secondary-color: #335e6f; /* ESA Grey-Blue / Table main progress timeline */
        --applications-color: #00b19d; /* ESA Teal / Stats button, coverage icons, sub progress timeline */
        --background-color: #ffffff;
        --border-color: rgba(0, 0, 0, 0.12);
        --border-radius: 4px;
        --font-family: Arial, sans-serif;
        --header-font: "NotesESAbold", sans-serif;
        --hover-bg: #eee;
        --expanded-bg: #ffffff;

        /* Dynamic table cell width (controlled by JS zoom slider) */
        --table-cell: 28px;

        /* Modal variables */
        --modal-z-index: 1000;
      }

      body {
        font-family: var(--font-family);
        margin: 0;
        background: var(--background-color);
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-sizing: border-box;
      }

      /* --- PAGE CONTAINER (MATCHES ESA-UI / EARTHCODE CONTAINER) --- */
      .app-container {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 100%;
        max-width: calc(1400px + 4rem);
        margin: 0 auto;
        padding: 32px 2rem 24px 2rem;
        box-sizing: border-box;
        overflow: hidden;
        gap: 16px;
      }

      @media (max-width: 45em) {
        .app-container {
          max-width: calc(1400px + 3rem);
          padding: 16px 1.5rem;
          overflow-y: auto;
          height: auto;
          gap: 12px;
        }
      }

      /* --- HEADER ROW --- */
      .metrics-header {
        flex-shrink: 0;
      }

      .metrics-header h1 {
        font-family: var(--header-font);
        color: var(--primary-color);
        margin: 0;
        font-size: 2.5rem; /* Matches Vuetify text-h2 */
        font-weight: normal;
      }

      @media (max-width: 960px) {
        .metrics-header h1 {
          font-size: 1.8rem;
        }
      }

      /* --- INLINE EOX-ITEMFILTER AREA (ALWAYS TOP INLINE-MODE, NO SIDEBAR) --- */
      .filter-row {
        flex-shrink: 0;
        background: var(--background-color);
        position: relative;
        z-index: 5;
        width: 100%;
      }

      eox-itemfilter {
        width: 100%;
        border: none;
        display: flex;
        flex-direction: column;
        --eox-body-font-family: var(--font-family);
        --padding: 0 !important;
        opacity: 0;
        transition: opacity 0.2s;
      }

      eox-itemfilter.ready {
        opacity: 1;
      }

      /* --- TABLE CONTAINER (MIDDLE SCROLLABLE AREA) --- */
      .table-row {
        flex-grow: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        max-height: 100%;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
      }

      .metrics-table-container {
        width: 100%;
        height: 100%;
        overflow: auto;
        position: relative;
      }

      .metrics-table {
        width: 100%;
        /* 
          Using border-collapse: separate instead of collapse, combined with border-spacing: 0.
          This is the standard industry practice to avoid browser rendering bugs with sticky columns,
          such as borders flickering, disappearing, or the leftmost/sticky column getting cut off when scrolling.
        */
        border-collapse: separate;
        border-spacing: 0;
        font-size: 14px;
        font-weight: 700;
        position: relative;
      }

      /* Base Header Cell Styles */
      .metrics-table thead {
        position: sticky;
        top: 0;
        z-index: 4;
        background: #ffffff;
      }

      .metrics-table thead tr {
        background: #ffffff; /* Row background holds white color */
      }

      .metrics-table th {
        background: transparent; /* Cells are transparent relative to each other so text can overflow */
        color: var(--primary-color);
        font-weight: 700;
        position: sticky;
        top: 0;
        z-index: 1; /* Stay underneath sticky column headers */
        padding: 0 10px !important;
        border-bottom: 2px solid var(--border-color);
        text-transform: capitalize;
        white-space: nowrap; /* Prevents text cutting off by wrapping vertically */
      }

      .metrics-table th span {
        white-space: nowrap;
        display: inline-block;
        overflow: visible; /* Allows year text to overflow into neighboring hidden year columns */
      }

      /* --- PERFECT STICKY COLUMNS FOR BOTH MAIN & SUB TABLES --- */
      /* Column 1 (Expand control): Sticky Left */
      .metrics-table th:first-child,
      .metrics-table tr:not(.expanded-row) > td:first-child,
      .sub-products-table td:first-child {
        position: sticky;
        left: 0;
        width: 70px;
        min-width: 70px;
        max-width: 70px;
        background: #ffffff !important; /* Solid opaque white background */
        z-index: 3;
        text-align: center;
        padding: 0 10px !important;
      }
      .metrics-table th:first-child {
        z-index: 4; /* Higher than regular table headers (z-index 1) */
      }

      /* Column 2 (Name): Sticky Left with offset */
      .metrics-table th:nth-child(2),
      .metrics-table tr:not(.expanded-row) > td:nth-child(2),
      .sub-products-table td:nth-child(2),
      .variable-name-cell,
      .product-name-cell {
        position: sticky;
        left: 70px;
        width: 136px;
        min-width: 136px;
        max-width: 136px;
        background: #ffffff !important; /* Solid opaque white background */
        z-index: 3;
        border-right: 1px solid var(--border-color);
        /* 
          Text-align left, line height reduced, and right-padding added 
          to break text gracefully and look exceptionally elegant without overlapping.
          Now bound explicitly via .variable-name-cell and .product-name-cell classes to guarantee
          flawless rendering on both variables (main row) and products (sub rows) alike!
        */
        text-align: left !important;
        line-height: 1.25 !important;
        padding: 8px 16px !important; /* PERFECT MATCH FOR px-4 py-2 IN ORIGINAL NUXT APP */
        overflow-wrap: break-word;
        word-wrap: break-word;
      }
      .metrics-table th:nth-child(2) {
        z-index: 4; /* Higher than regular table headers (z-index 1) */
      }

      /* Column Last (Coverage): Sticky Right */
      .metrics-table th:last-child,
      .metrics-table tr:not(.expanded-row) > td:last-child,
      .sub-products-table td:last-child {
        position: sticky;
        /*
          Using right: -1px instead of right: 0px.
          This pulls the column slightly to the right by 1px, sealing any sub-pixel rounding gap
          created by high-DPI browsers and stopping year cells/timeline bars from "peeking through".
        */
        right: -1px;
        width: 100px;
        min-width: 100px;
        max-width: 100px;
        background: #ffffff !important; /* Solid opaque white background */
        z-index: 3;
        border-left: 1px solid var(--border-color);
        text-align: center;
        padding: 0 10px !important;
      }
      .metrics-table th:last-child {
        z-index: 4; /* Higher than regular table headers (z-index 1) */
      }

      /* --- EXACT 1PX HORIZONTAL SCROLL SHIFT COMPENSATION FOR NESTED STICKY COLUMNS --- */
      /* Since the inner table is nested within colspan, browser borders create a tiny 1px shift to the right. */
      /* We use transform: translateX(-1px) to pull them exactly 1px to the left for pixel-perfect vertical alignment! */
      .sub-products-table td:first-child {
        left: 0 !important;
        transform: translateX(-1px);
        padding: 0 10px !important; /* Removed vertical padding conflict to center cov-btn vertically */
        vertical-align: middle !important;
      }
      .sub-products-table td:nth-child(2),
      .sub-products-table .product-name-cell {
        left: 70px !important;
        transform: translateX(-1px);
      }
      .sub-products-table td:last-child {
        padding: 0 10px !important; /* Removed vertical padding conflict to center cov-btn vertically */
        vertical-align: middle !important;
      }

      /* --- TABLE COLS & PREVENT YEAR OVERLAP MODES --- */
      /* Dynamic year columns (No padding to eliminate gaps!) */
      .metrics-table
        th:not(:first-child, :nth-child(2), :last-child, .table-spacer-cell),
      .metrics-table
        td:not(:first-child, :nth-child(2), :last-child, .table-spacer-cell),
      .sub-products-table
        td:not(:first-child, :nth-child(2), :last-child, .table-spacer-cell) {
        text-align: center;
        width: var(--table-cell);
        min-width: var(--table-cell);
        max-width: var(--table-cell);
        padding: 0 !important; /* EXACTLY 0 padding to ensure seamless blocks */
        margin: 0 !important;
      }

      /* --- HIGH FIDELITY EMPTY MARGIN SPACER COLUMNS --- */
      /* Base styles for breathing room margins */
      .metrics-table th.table-spacer-cell,
      .metrics-table td.table-spacer-cell,
      .sub-products-table td.table-spacer-cell {
        padding: 0 !important;
        margin: 0 !important;
        background: transparent;
        border-bottom: 1px solid var(--border-color);
      }

      /* --- DYNAMIC COMFORTABLE BREATHING ROOM SPACER WIDTHS BY ZOOM --- */
      /* Under Zoom 1: Spacers are 4px so they don't combine with empty cell buffers to create massive odd gaps */
      .metrics-table.zoom-1 .table-spacer-cell,
      .sub-products-table.zoom-1 .table-spacer-cell {
        width: 4px !important;
        min-width: 4px !important;
        max-width: 4px !important;
      }
      /* Under Zoom 2: Spacers are 10px */
      .metrics-table.zoom-2 .table-spacer-cell,
      .sub-products-table.zoom-2 .table-spacer-cell {
        width: 10px !important;
        min-width: 10px !important;
        max-width: 10px !important;
      }
      /* Under Zoom 3: Spacers scale up to full 16px to give luxurious breathing space */
      .metrics-table.zoom-3 .table-spacer-cell,
      .sub-products-table.zoom-3 .table-spacer-cell {
        width: 16px !important;
        min-width: 16px !important;
        max-width: 16px !important;
      }

      /* --- EXACT HIDE-EVEN LOGIC FROM ORIGINAL METRICSTABLE.VUE --- */
      /* When zoom is < 3, hide every second year's label so text stays side-by-side without wrapping or clipping */
      /* Note: index 3 is Column 3 (the table-spacer-cell is index 2), so year cells start at index 3. nth-child(even) handles odd years perfectly */
      .metrics-table.hide-even
        th:not(
          :first-child,
          :nth-child(2),
          :last-child,
          .table-spacer-cell
        ):nth-child(even)
        > span {
        visibility: hidden;
      }

      .metrics-table th,
      .metrics-table td,
      .sub-products-table td {
        border-bottom: 1px solid var(--border-color);
        box-sizing: border-box;
        height: 38px;
        vertical-align: middle !important; /* Force browser's vertical centering on all rows */
      }

      .metrics-table tbody tr {
        background: #ffffff;
      }

      /* Hover states - matching old metrics table hovering exactly */
      .metrics-table tbody tr:hover:not(.expanded-row) {
        background: #eee !important;
      }

      /* Column-based hover highlighting (vertical tracking effect) */
      .metrics-table td.hoverCell,
      .sub-products-table td.hoverCell {
        background-color: #eee !important;
      }

      /* --- TIMELINE PROGRESS BARS (EXACT ROUNDING, NO GAPS) --- */
      .timeline-bar {
        height: 15px; /* Matches height="15" exactly */
        width: 100%;
        display: block;
        box-sizing: border-box;
        margin: 0 !important;
        padding: 0 !important;
        background-color: var(
          --secondary-color
        ); /* Variables timeline color: #335E6F */
        border-radius: 0;
      }

      .timeline-bar.sub-bar {
        background-color: var(
          --applications-color
        ); /* Products timeline color: #00B19D */
      }

      /* Border radius logic - rounding left of first item and right of last item only */
      .timeline-bar.cap-left {
        border-top-left-radius: 5px;
        border-bottom-left-radius: 5px;
      }

      .timeline-bar.cap-right {
        border-top-right-radius: 5px;
        border-bottom-right-radius: 5px;
      }

      .timeline-bar.single {
        border-radius: 5px;
      }

      /* --- EXPANDED SUB-TABLES --- */
      .metrics-table tr.expanded-row {
        background: #ffffff !important;
      }

      /*
        Using direct child combinator (tr.expanded-row > td) instead of descendant selector (tr.expanded-row td).
        This restricts the padding: 0 !important rule exclusively to the parent cell containing the sub-table,
        preventing it from leaking down and wiping out the padding on .product-name-cell inside the sub-table!
        
        Also set border-bottom: none !important so we don't create double bottom borders when sub-table holds its own borders.
      */
      .metrics-table tr.expanded-row > td {
        padding: 0 !important;
        z-index: 0 !important;
        border-bottom: none !important; /* Eliminates the outer parent double border! */
        height: auto !important; /* Allow expanded row cell to grow to fit the sub-table! */
      }

      .sub-products-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
      }

      .sub-products-table tr {
        line-height: 3;
        background: #ffffff;
      }

      .sub-products-table tr:hover {
        background: #eee !important;
      }

      /* The bottom border is cleanly held by the sub-products cells instead of creating a double border */
      .sub-products-table tr:last-child td {
        border-bottom: 1px solid var(--border-color) !important;
      }

      /* Link/text colors in table - harmonized to beautiful blue from metrics.vue */
      .metrics-table a,
      .sub-products-table a {
        color: var(
          --secondary-color
        ) !important; /* Blue variable/product text: #335E6F */
        text-decoration: none;
      }

      .metrics-table a:hover,
      .sub-products-table a:hover {
        text-decoration: underline;
      }

      /* --- BUTTONS & CONTROLS --- */
      /* Harmonized all circular buttons in the table (expand arrows, planets, pins, and collection links) to be exactly 32px by 32px */
      .chevron-toggle {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--secondary-color);
        font-size: 24px;
        width: 32px; /* Unified to 32px diameter */
        height: 32px; /* Unified to 32px diameter */
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.2s;
        padding: 0;
      }

      .chevron-toggle:hover {
        background-color: rgba(0, 0, 0, 0.05);
      }

      .noAvailableProduct {
        font-size: 10px;
        margin: 4px auto;
        padding: 3px;
        background: rgb(182, 126, 52);
        border-radius: 5px;
        color: white;
        width: 50px;
        text-align: center;
        font-weight: normal;
        line-height: initial;
      }

      /* Harmonized Planet and Pin icons sizes precisely */
      .v-btn-icon-mock i,
      .cov-btn i,
      .chevron-toggle i {
        font-size: 20px !important;
      }

      /* 
        Visually offsets the icon glyph inside circular buttons down by exactly 1px.
        This neutralizes the natural font baseline offset, centering the icons perfectly inside the circular outlines.
      */
      .v-btn-icon-mock i,
      .cov-btn i,
      .chevron-toggle i {
        position: relative;
        top: 1px;
      }

      /* Unified main row planet button to exact same 32px by 32px dimensions as sub-buttons and chevron toggles! */
      .v-btn-icon-mock {
        background: none;
        border: none;
        border-radius: 50%;
        width: 32px; /* Unified to 32px diameter */
        height: 32px; /* Unified to 32px diameter */
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--secondary-color);
        transition: background-color 0.2s;
        margin: 0 auto; /* Horizontally center */
      }

      .v-btn-icon-mock:hover {
        background-color: rgba(0, 0, 0, 0.05);
      }

      .cov-btn {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--applications-color);
        width: 32px; /* Unified to 32px diameter */
        height: 32px; /* Unified to 32px diameter */
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        vertical-align: middle; /* Center inline within table cell */
        margin: 0 auto; /* Horizontally center */
      }

      .cov-btn:hover {
        background: rgba(0, 0, 0, 0.05);
      }

      /* --- BOTTOM CONTROLS BAR (EXACTLY MATCHING OLD METRICS.VUE) --- */
      .bottom-row {
        flex-shrink: 0;
        background: var(--background-color);
        padding: 8px 0;
        box-sizing: border-box;
      }

      .v-container-mock {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
      }

      .controls-left,
      .controls-right {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      /* Button exactly styled as Vuetify dark button with "applications" color (#00B19D) */
      .v-btn-mock {
        background-color: var(--applications-color);
        color: white;
        border: none;
        border-radius: 4px;
        padding: 0 16px;
        font-size: 14px;
        /* Typography matches heading-font-family exactly from assets/variables.scss */
        font-family: var(--header-font), var(--font-family) !important;
        font-weight: normal !important; /* NotesESAbold is built-in bold */
        text-transform: uppercase;
        height: 36px;
        letter-spacing: 1.25px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0px 3px 1px -2px rgba(0, 0, 0, 0.2),
          0px 2px 2px 0px rgba(0, 0, 0, 0.14),
          0px 1px 5px 0px rgba(0, 0, 0, 0.12);
        transition: background-color 0.2s, box-shadow 0.2s;
        box-sizing: border-box;
      }

      .v-btn-mock:hover {
        background-color: #009685;
        box-shadow: 0px 2px 4px -1px rgba(0, 0, 0, 0.2),
          0px 4px 5px 0px rgba(0, 0, 0, 0.14),
          0px 1px 10px 0px rgba(0, 0, 0, 0.12);
      }

      .v-btn-icon-mock {
        background: none;
        border: none;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--secondary-color);
        font-size: 24px;
        transition: background-color 0.2s;
      }

      .v-btn-icon-mock:hover {
        background-color: rgba(0, 0, 0, 0.05);
      }

      /* Vuetify styled Outlined Select dropdown with floating label appearance */
      .v-select-container {
        position: relative;
        display: flex;
        flex-direction: column;
      }

      .v-select-label {
        position: absolute;
        top: -8px;
        left: 10px;
        background: white;
        padding: 0 4px;
        font-size: 11px;
        color: var(--secondary-color);
        font-weight: 500;
        z-index: 2;
      }

      .v-select-mock {
        font-family: var(--font-family);
        font-size: 14px;
        font-weight: normal;
        color: rgba(0, 0, 0, 0.87);
        padding: 8px 32px 8px 12px;
        border: 1px solid rgba(0, 0, 0, 0.38);
        border-radius: 4px;
        height: 40px;
        background: white;
        outline: none;
        cursor: pointer;
        min-width: 180px;
        text-transform: capitalize;
        appearance: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path fill='%23335E6F' d='M7,10L12,15L17,10H7Z'/></svg>");
        background-repeat: no-repeat;
        background-position: right 8px center;
        background-size: 24px;
      }

      .v-select-mock:focus {
        border-color: var(--applications-color);
        border-width: 2px;
      }

      /* Slider layout exactly matching old Metrics view slider */
      .v-slider-mock-container {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--secondary-color);
        width: 260px;
      }

      .v-slider-mock-container i {
        font-size: 24px;
        cursor: pointer;
        color: var(--secondary-color);
        user-select: none;
      }

      .v-slider-mock-container i:hover {
        color: var(--primary-color);
      }

      .v-slider-mock {
        appearance: none;
        width: 100%;
        height: 2px; /* Super thin linear line of Vuetify slider */
        background: rgba(0, 0, 0, 0.26);
        outline: none;
        position: relative;
      }

      .v-slider-mock::-webkit-slider-thumb {
        appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--secondary-color);
        cursor: pointer;
        transition: transform 0.1s ease;
      }

      .v-slider-mock::-webkit-slider-thumb:hover {
        transform: scale(1.3);
      }

      /* --- MODALS (DIALOGS) --- */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.5);
        display: none; /* Controlled by JS/CSS class .open */
        align-items: center;
        justify-content: center;
        z-index: var(--modal-z-index);
      }

      .modal-overlay.open {
        display: flex;
      }

      .modal-container {
        background: #ffffff;
        border-radius: 4px;
        width: 90%;
        max-width: 1000px;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0px 11px 15px -7px rgba(0, 0, 0, 0.2),
          0px 24px 38px 3px rgba(0, 0, 0, 0.14),
          0px 9px 46px 8px rgba(0, 0, 0, 0.12);
        overflow: hidden;
      }

      .modal-header {
        padding: 16px 24px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .modal-header h3 {
        font-family: var(--font-family);
        color: var(--primary-color);
        margin: 0;
        font-size: 1.25rem;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .modal-close-btn {
        background: none;
        border: none;
        font-size: 24px;
        color: var(--secondary-color);
        cursor: pointer;
        padding: 0;
        width: 36px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
      }

      .modal-close-btn:hover {
        background-color: rgba(0, 0, 0, 0.05);
      }

      .modal-body {
        padding: 24px;
        overflow-y: auto;
        flex-grow: 1;
        color: rgba(0, 0, 0, 0.87);
      }

      .modal-footer {
        padding: 8px 16px;
        border-top: 1px solid var(--border-color);
        display: flex;
        justify-content: flex-end;
      }

      /* --- STATISTICS MODAL --- */
      .stats-summary {
        font-size: 16px;
        color: rgba(0, 0, 0, 0.87);
        margin-bottom: 24px;
        font-weight: normal;
      }

      .chart-section-title {
        text-align: center;
        margin: 24px 0;
        font-size: 14px;
        color: rgba(0, 0, 0, 0.87);
      }

      .stats-two-col {
        display: flex;
        flex-direction: column;
        gap: 24px;
        margin-top: 24px;
      }

      .stats-col-title {
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 8px;
      }

      .stats-flex-container {
        display: flex;
        gap: 16px;
        align-items: stretch;
      }

      .stats-flex-container .stats-list {
        flex: 1;
      }

      .pie-chart-container {
        width: 450px;
        height: 450px;
        position: relative;
        flex-shrink: 0;
      }

      .stats-list {
        max-height: 400px;
        overflow-y: auto;
        border: 1px solid var(--border-color);
        border-radius: 4px;
      }

      .stats-list-item {
        display: flex;
        align-items: center;
        padding: 8px 16px;
        font-size: 13px;
        border-bottom: 1px solid var(--border-color);
      }

      .stats-list-item:last-child {
        border-bottom: none;
      }

      .stats-list-item i {
        font-size: 18px;
        margin-right: 8px;
      }

      .chart-mock-box {
        width: 100%;
        height: 250px;
        background: #fafafa;
        border: 1px dashed var(--border-color);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--secondary-color);
        border-radius: 4px;
      }

      /* --- COVERAGE MODAL --- */
      .coverage-split {
        display: grid;
        grid-template-columns: 350px 1fr;
        gap: 20px;
        height: 500px;
      }

      .cov-list {
        border: 1px solid var(--border-color);
        border-radius: 4px;
        overflow-y: auto;
        padding: 12px;
        background: #fafafa;
      }

      .cov-list-title {
        font-size: 12px;
        font-weight: 500;
        color: rgba(0, 0, 0, 0.54);
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border-color);
        margin-bottom: 12px;
      }

      .cov-item {
        background: #ffffff;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 12px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: border-color 0.2s;
      }

      .cov-item:hover {
        border-color: var(--applications-color);
      }

      .cov-item.active {
        background-color: rgba(0, 177, 157, 0.05);
        border-color: var(--applications-color);
      }

      .cov-item-name {
        font-size: 14px;
        font-weight: 600;
        color: rgba(0, 0, 0, 0.87);
        margin-bottom: 6px;
      }

      .cov-item-meta {
        font-size: 12px;
        color: rgba(0, 0, 0, 0.54);
        margin-top: 4px;
      }

      .cov-item-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 10px;
      }

      .cov-map-container {
        position: relative;
        height: 100%;
        border: 1px solid var(--border-color);
        border-radius: 4px;
      }

      /* --- RESPONSIVE ADAPTATIONS --- */
      @media (max-width: 960px) {
        .bottom-row {
          padding: 12px;
        }

        .v-container-mock {
          flex-direction: column;
          align-items: stretch;
        }

        .controls-left,
        .controls-right {
          justify-content: space-between;
          width: 100%;
        }

        .v-select-mock {
          flex-grow: 1;
        }

        /* stats-two-col removed because it is a flex column by default */

        .stats-flex-container {
          flex-direction: column;
          gap: 12px;
        }

        .stats-list {
          max-height: 200px;
        }

        .pie-chart-container {
          width: 100%;
          max-width: 300px;
          height: 300px;
          margin: 0 auto;
        }

        .coverage-split {
          display: flex;
          flex-direction: column;
          height: auto;
          gap: 16px;
        }

        .cov-list {
          height: 250px;
          flex-shrink: 0;
        }

        .cov-map-container {
          height: 350px;
          flex-shrink: 0;
        }

        /* Responsive Table Sticky Offsets for small screens */
        .metrics-table th:nth-child(2),
        .metrics-table tr:not(.expanded-row) > td:nth-child(2),
        .sub-products-table td:nth-child(2),
        .variable-name-cell,
        .product-name-cell {
          left: 40px;
          width: 90px;
          min-width: 90px;
          max-width: 90px;
        }

        .metrics-table th:first-child,
        .metrics-table tr:not(.expanded-row) > td:first-child,
        .sub-products-table td:first-child {
          width: 40px;
          min-width: 40px;
          max-width: 40px;
        }

        .metrics-table th:last-child,
        .metrics-table tr:not(.expanded-row) > td:last-child,
        .sub-products-table td:last-child {
          width: 60px;
          min-width: 60px;
          max-width: 60px;
        }

        /* Compensate 1px shift on mobile screens too! */
        .sub-products-table td:first-child {
          left: 0 !important;
          transform: translateX(-1px);
        }
        .sub-products-table td:nth-child(2),
        .sub-products-table .product-name-cell {
          left: 40px !important;
          transform: translateX(-1px);
        }
      }

      /* --- LOADING OVERLAY --- */
      .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      .loading-overlay.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(0, 50, 71, 0.1);
        border-radius: 50%;
        border-top-color: var(--primary-color, #003247);
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
      <div class="loading-spinner"></div>
    </div>

    <!-- MAIN SCREEN CONTAINER -->
    <div class="app-container">
      <!-- TITLE ROW -->
      <div class="metrics-header">
        <h1>Metrics</h1>
      </div>

      <!-- INLINE EOX-ITEMFILTER (TOP ROW, NO SIDEBAR LAYOUT) -->
      <div class="filter-row">
        <eox-itemfilter id="itemfilter" inline-mode></eox-itemfilter>
      </div>

      <!-- SCROLLABLE TABLE ROW -->
      <div class="table-row">
        <div class="metrics-table-container">
          <table id="metrics-table" class="metrics-table">
            <thead>
              <!-- Headers will be generated dynamically to cover 1960 to 2026 -->
              <tr>
                <th scope="col" aria-label="Expand column"></th>
                <th scope="col">Name</th>
                <!-- Populated dynamically -->
                <th scope="col">Coverage</th>
              </tr>
            </thead>
            <tbody id="metrics-table-body">
              <!-- Populated dynamically with exact years 1960 to 2026 -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- BOTTOM CONTROL ROW (EXACTLY MATCHING OLD VERSION) -->
      <div class="bottom-row">
        <div class="v-container-mock">
          <!-- Left Controls -->
          <div class="controls-left">
            <button id="btn-stats-open" class="v-btn-mock">
              <i class="mdi mdi-poll"></i> Statistics
            </button>

            <div class="v-select-container">
              <span class="v-select-label">Aggregate by</span>
              <select id="aggregation-select" class="v-select-mock">
                <option value="variables" selected>variables</option>
                <option value="projects">projects</option>
                <option value="eo-missions">eo-missions</option>
                <option value="themes">themes</option>
              </select>
            </div>
          </div>

          <!-- Right Controls -->
          <div class="controls-right">
            <!-- Empty Toggle Button (Defaults to hiding empty) -->
            <button
              id="btn-toggle-empty"
              class="v-btn-icon-mock"
              title="Show empty variables"
            >
              <i class="mdi mdi-archive-cancel-outline"></i>
            </button>

            <!-- Zoom slider control matching old MetricsTable styling -->
            <div class="v-slider-mock-container" title="Table Zoom">
              <i
                class="mdi mdi-magnify-minus-outline"
                id="zoom-out-trigger"
              ></i>
              <input
                type="range"
                id="zoom-slider"
                min="1"
                max="3"
                value="1"
                step="1"
                class="v-slider-mock"
                aria-label="Table zoom slider"
              />
              <i class="mdi mdi-magnify-plus-outline" id="zoom-in-trigger"></i>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- STATISTICS DIALOG OVERLAY -->
    <div
      class="modal-overlay"
      id="modal-statistics"
      aria-modal="true"
      role="dialog"
    >
      <div class="modal-container">
        <div class="modal-header">
          <h3>
            <i
              class="mdi mdi-poll"
              style="color: var(--applications-color)"
            ></i>
            All stats
          </h3>
          <button
            class="modal-close-btn"
            id="btn-stats-close"
            aria-label="Close Statistics Dialog"
          >
            <i class="mdi mdi-close"></i>
          </button>
        </div>
        <div class="modal-body">
          <div class="stats-summary">
            Number of products: <span id="stats-total-products">123</span>
          </div>

          <div class="chart-section-title">Temporal coverage</div>
          <div
            class="chart-mock-box"
            style="
              height: 250px;
              position: relative;
              border: none;
              background: transparent;
            "
          >
            <eox-chart
              id="productsChart"
              style="width: 100%; height: 100%"
            ></eox-chart>
          </div>

          <hr
            style="
              border: 0;
              border-top: 1px solid var(--border-color);
              margin: 24px 0;
            "
          />

          <div class="stats-two-col">
            <!-- Left: Variable distribution list & Pie chart -->
            <div>
              <div class="stats-col-title">Variable distribution</div>
              <div class="stats-flex-container">
                <div class="stats-list" id="stats-variables-list"></div>
                <div class="pie-chart-container">
                  <eox-chart
                    id="variablePie"
                    style="width: 100%; height: 100%"
                  ></eox-chart>
                </div>
              </div>
            </div>

            <hr
              style="
                border: 0;
                border-top: 1px solid var(--border-color);
                margin: 8px 0;
              "
            />

            <!-- Right: Satellite mission distribution list & Pie chart -->
            <div>
              <div class="stats-col-title">Satellite mission distribution</div>
              <div class="stats-flex-container">
                <div class="stats-list" id="stats-missions-list"></div>
                <div class="pie-chart-container">
                  <eox-chart
                    id="missionPie"
                    style="width: 100%; height: 100%"
                  ></eox-chart>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button
            class="v-btn-mock"
            id="btn-stats-footer-close"
            style="
              background-color: transparent;
              color: var(--applications-color);
              border: 1px solid var(--applications-color);
              box-shadow: none;
            "
          >
            Close
          </button>
        </div>
      </div>
    </div>

    <!-- COVERAGE MAP DIALOG OVERLAY -->
    <div
      class="modal-overlay"
      id="modal-coverage"
      aria-modal="true"
      role="dialog"
    >
      <div class="modal-container">
        <div class="modal-header">
          <h3>
            <i
              class="mdi mdi-earth"
              style="color: var(--applications-color)"
            ></i>
            <span id="coverage-modal-title"
              >Sea Surface Temperature Coverage</span
            >
          </h3>
          <button
            class="modal-close-btn"
            id="btn-coverage-close"
            aria-label="Close Coverage Dialog"
          >
            <i class="mdi mdi-close"></i>
          </button>
        </div>
        <div class="modal-body" style="padding: 16px">
          <div class="coverage-split">
            <!-- Left Panel: Products under the selected variable -->
            <div class="cov-list">
              <div class="cov-list-title">Products</div>
              <div id="coverage-products-list"></div>
            </div>

            <!-- Right Panel: Geospatial Map Area -->
            <div class="cov-map-container">
              <!-- EOx-Map Component template -->
              <eox-map
                id="coverage-eox-map"
                style="
                  position: absolute;
                  top: 0;
                  left: 0;
                  width: 100%;
                  height: 100%;
                "
              ></eox-map>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button
            class="v-btn-mock"
            id="btn-coverage-footer-close"
            style="
              background-color: transparent;
              color: var(--applications-color);
              border: 1px solid var(--applications-color);
              box-shadow: none;
            "
          >
            Close
          </button>
        </div>
      </div>
    </div>

    <!-- CORE SCRIPTS FOR INTERACTION -->
    <script type="module">
      import { createMetrics } from "./js/metrics-engine.js";
      import {
        fetchProducts,
        fetchAllAggregationItems,
      } from "./js/data-fetching.js";

      const itemFilterEl = document.querySelector("#itemfilter");

      const urlParams = new URLSearchParams(window.location.search);
      const BASE_URL =
        urlParams.get("baseUrl") ||
        "https://esa-earthcode.github.io/open-science-catalog-metadata";

      let apiUrlParam =
        urlParams.get("apiUrl") ||
        "https://eoapi.workspace.earthcode.eox.at/stac/collections";
      if (
        apiUrlParam &&
        !apiUrlParam.endsWith("/collections") &&
        !apiUrlParam.endsWith("/collections/")
      ) {
        apiUrlParam = apiUrlParam.replace(/\/?$/, "/collections");
      }
      const API_URL = apiUrlParam;

      // --- GENERATE DUMMY DATA FROM 1960 TO 2026 ---
      const startYear = 1960;
      const endYear = 2026;
      const yearsList = [];
      for (let y = startYear; y <= endYear; y++) {
        yearsList.push(y);
      }

      // Generate Table Headers with odd/even tracking index and empty margins at the start and end
      const tableEl = document.getElementById("metrics-table");
      const theadRow = tableEl.querySelector("thead tr");
      theadRow.innerHTML = `
        <th scope="col" aria-label="Expand column"></th>
        <th scope="col">Name</th>
        <th class="table-spacer-cell"></th> <!-- Spacer column for breathing room at table start -->
        ${yearsList
          .map((y) => {
            return `<th scope="col"><span>${y}</span></th>`;
          })
          .join("")}
        <th class="table-spacer-cell"></th> <!-- Spacer column for breathing room at table end -->
        <th scope="col">Coverage</th>
      `;

      // State variables
      let products = [];
      let filteredProducts = [];
      let metrics = null;
      let aggregationProperty = "variables";
      let showEmptyItems = false;
      let allAggregationItems = null;

      // Populate EOx Itemfilter properties
      itemFilterEl.filterProperties = [
        {
          id: "search",
          keys: ["title", "description", "keywords"],
          title: "Freetext search",
          type: "text",
          placeholder: "Search in titles, descriptions and keywords",
          expanded: true,
        },
        { id: "theme", key: "theme", title: "Theme" },
        { id: "variable", key: "variable", title: "Variable" },
        { id: "project", key: "project", title: "Project" },
        { id: "mission", key: "eo-mission", title: "EO Mission" },
        { id: "geometry", key: "geometry", type: "spatial", title: "Geometry" },
        {
          id: "osc:type",
          key: "osc:type",
          title: "Type",
          type: "multiselect",
          filterKeys: ["Product", "Workflow"],
        },
      ];
      itemFilterEl.showResults = false;

      // Render timeline progress bars with exact rounding logic and 0px spacing
      const renderTimelineCells = (activeYears, isSub = false) => {
        return yearsList
          .map((y, index) => {
            const isActive = activeYears.includes(y);
            if (!isActive) {
              return `<td class="year-cell"></td>`;
            }

            // Rounded edges matching the bounds of the active years
            const prevActive =
              index > 0 && activeYears.includes(yearsList[index - 1]);
            const nextActive =
              index < yearsList.length - 1 &&
              activeYears.includes(yearsList[index + 1]);

            let radiusClass = "middle";
            if (!prevActive && !nextActive) {
              radiusClass = "single";
            } else if (!prevActive) {
              radiusClass = "cap-left";
            } else if (!nextActive) {
              radiusClass = "cap-right";
            }

            const subClass = isSub ? "sub-bar" : "";

            return `
            <td class="year-cell">
              <span class="timeline-bar ${subClass} ${radiusClass}"></span>
            </td>
          `;
          })
          .join("");
      };

      // Populate Table Body dynamically
      const tbody = document.getElementById("metrics-table-body");

      const renderTable = (rows) => {
        tbody.innerHTML = rows
          .map((row) => {
            const hasProducts =
              row.products && Object.keys(row.products).length > 0;
            const activeYearsList = row.years
              ? Object.keys(row.years).map(Number)
              : [];

            if (!hasProducts) {
              return `
              <tr>
                <td>
                  <div class="noAvailableProduct">No products available</div>
                </td>
                <td class="variable-name-cell">
                  <a href="#" style="font-size: 12px; font-weight: 700;">${
                    row.name
                  }</a>
                </td>
                <td class="table-spacer-cell"></td> <!-- Spacer start -->
                ${renderTimelineCells(activeYearsList)}
                <td class="table-spacer-cell"></td> <!-- Spacer end -->
                <td>
                  <button class="v-btn-icon-mock" title="View variable coverage on map" style="color: var(--secondary-color);" disabled>
                    <i class="mdi mdi-earth"></i>
                  </button>
                </td>
              </tr>
            `;
            }

            const productsList = Object.values(row.products);

            return `
            <tr class="parent-row" data-id="${row.id}">
              <td>
                <button class="chevron-toggle" aria-label="Expand Variable Details">
                  <i class="mdi mdi-chevron-down"></i>
                </button>
              </td>
              <td class="variable-name-cell">
                <a href="#" style="font-size: 12px; font-weight: 700;">${
                  row.name
                }</a>
              </td>
              <td class="table-spacer-cell"></td> <!-- Spacer start -->
              ${renderTimelineCells(activeYearsList)}
              <td class="table-spacer-cell"></td> <!-- Spacer end -->
              <td>
                <button class="v-btn-icon-mock" title="View variable coverage on map" style="color: var(--secondary-color);">
                  <i class="mdi mdi-earth"></i>
                </button>
              </td>
            </tr>
            <tr class="expanded-row" id="expanded-${
              row.id
            }" style="display: none;">
              <!-- colspan expanded from +2 to +5 to seamlessly cover the spacer columns too -->
              <td colspan="${yearsList.length + 5}">
                <table class="sub-products-table">
                  <tbody>
                    ${productsList
                      .map((prod) => {
                        const prodYears = prod.years
                          ? Object.keys(prod.years).map(Number)
                          : [];
                        return `
                        <tr>
                          <td>
                            <button class="cov-btn" title="Go to product collection" style="color: var(--applications-color);" data-prod-id="${
                              prod.id
                            }">
                              <i class="mdi mdi-open-in-new"></i>
                            </button>
                          </td>
                          <td class="product-name-cell">
                            <a href="#" style="font-size: 12px; cursor: pointer; font-weight: 700;">${
                              prod.name
                            }</a>
                          </td>
                          <td class="table-spacer-cell"></td> <!-- Spacer start -->
                          ${renderTimelineCells(prodYears, true)}
                          <td class="table-spacer-cell"></td> <!-- Spacer end -->
                          <td>
                            <button class="cov-btn" title="View product coverage map" style="color: var(--applications-color);" data-prod-id="${
                              prod.id
                            }">
                              <i class="mdi mdi-map-marker"></i>
                            </button>
                          </td>
                        </tr>
                      `;
                      })
                      .join("")}
                  </tbody>
                </table>
              </td>
            </tr>
          `;
          })
          .join("");
      };

      const updateView = async () => {
        if (!metrics) return;

        let rows = Object.values(metrics[aggregationProperty] || {});

        if (showEmptyItems) {
          if (!allAggregationItems) {
            allAggregationItems = await fetchAllAggregationItems(
              BASE_URL,
              aggregationProperty
            );
          }
          const merged = {
            ...allAggregationItems,
            ...metrics[aggregationProperty],
          };
          rows = Object.values(merged);
        }

        // Sort rows alphabetically by name
        rows.sort((a, b) => {
          const nameA = a.name || "";
          const nameB = b.name || "";
          return nameA.localeCompare(nameB, "en", { sensitivity: "base" });
        });

        renderTable(rows);
      };

      // --- DIALOG OPEN/CLOSE LOGIC ---
      const setupModal = (
        overlayId,
        openTriggerId,
        closeTriggerIds,
        onOpen = null
      ) => {
        const overlay = document.getElementById(overlayId);
        const openBtn = document.getElementById(openTriggerId);

        if (openBtn) {
          openBtn.addEventListener("click", () => {
            if (onOpen) onOpen();
            overlay.classList.add("open");
          });
        }

        closeTriggerIds.forEach((id) => {
          const btn = document.getElementById(id);
          if (btn) {
            btn.addEventListener("click", () => {
              overlay.classList.remove("open");
            });
          }
        });

        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) {
            overlay.classList.remove("open");
          }
        });
      };

      // --- COLOR HASHING UTILITY ---
      const textToHex = (str) => {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          hash = str.charCodeAt(i) + ((hash << 5) - hash);
        }
        let color = "#";
        for (let i = 0; i < 3; i++) {
          const value = (hash >> (i * 8)) & 0xff;
          color += ("00" + value.toString(16)).slice(-2);
        }
        return color;
      };

      // --- VEGA DOUGHNUT CHART SPEC GENERATOR ---
      const getDoughnutSpec = (
        dataValues,
        colorRange,
        defaultName,
        size = 450
      ) => {
        const innerMain = Math.round(size * 0.244);
        const outerMain = Math.round(size * 0.355);
        const innerHover = Math.round(size * 0.373);
        const outerHover = Math.round(size * 0.395);
        const titleDy = Math.round(size * -0.444);
        const titleFontSize = size < 350 ? 12 : 14;
        const countFontSize = size < 350 ? 14 : 18;
        const percentFontSize = size < 350 ? 12 : 16;
        const textLimit = size - 20;

        return {
          $schema: "https://vega.github.io/schema/vega-lite/v5.json",
          width: size,
          height: size,
          padding: 10,
          autosize: {
            type: "fit",
            contains: "padding",
          },
          data: {
            values: dataValues,
          },
          layer: [
            // Layer 1: Outer hover ring
            {
              mark: {
                type: "arc",
                innerRadius: innerHover,
                outerRadius: outerHover,
                stroke: "white",
                strokeWidth: 1.5,
              },
              encoding: {
                opacity: {
                  condition: { param: "hover", value: 1, empty: false },
                  value: 0,
                },
              },
            },
            // Layer 2: Main doughnut ring
            {
              params: [
                {
                  name: "hover",
                  select: {
                    type: "point",
                    on: "pointerover",
                    empty: false,
                  },
                  value: { name: defaultName },
                },
              ],
              mark: {
                type: "arc",
                innerRadius: innerMain,
                outerRadius: outerMain,
                stroke: "white",
                strokeWidth: 1.5,
              },
            },
            // Layer 3: Text above the pie (hovered section name)
            {
              transform: [{ filter: { param: "hover", empty: false } }],
              mark: {
                type: "text",
                dy: titleDy,
                fontSize: titleFontSize,
                fontWeight: "bold",
                align: "center",
                baseline: "middle",
                clip: false,
                limit: textLimit,
              },
              encoding: {
                text: { field: "name", type: "nominal" },
                theta: null,
                color: {
                  field: "name",
                  type: "nominal",
                  scale: {
                    domain: dataValues.map((d) => d.name),
                    range: colorRange,
                  },
                  legend: null,
                },
              },
            },
            // Layer 4: Text inside the ring (count of products)
            {
              transform: [{ filter: { param: "hover", empty: false } }],
              mark: {
                type: "text",
                dy: -8,
                fontSize: countFontSize,
                fontWeight: "bold",
                align: "center",
                baseline: "middle",
              },
              encoding: {
                text: { field: "count_label", type: "nominal" },
                theta: null,
                color: { value: "#000000" },
              },
            },
            // Layer 5: Text inside the ring (percentage)
            {
              transform: [{ filter: { param: "hover", empty: false } }],
              mark: {
                type: "text",
                dy: size < 350 ? 10 : 16,
                fontSize: percentFontSize,
                align: "center",
                baseline: "middle",
              },
              encoding: {
                text: { field: "percent_label", type: "nominal" },
                theta: null,
                color: { value: "#666666" },
              },
            },
          ],
          encoding: {
            theta: { field: "count", type: "quantitative" },
            color: {
              field: "name",
              type: "nominal",
              scale: {
                domain: dataValues.map((d) => d.name),
                range: colorRange,
              },
              legend: null,
            },
            order: {
              field: "count",
              type: "quantitative",
              sort: "descending",
            },
          },
          config: {
            view: { stroke: null },
            renderer: "svg",
          },
        };
      };

      // --- STATS DIALOG POPULATION & CHART CONFIGURATION ---
      const openStatisticsModal = () => {
        if (!metrics) return;

        // Populate total count
        document.getElementById("stats-total-products").textContent =
          metrics.numberOfProducts || 0;

        // Sort variables
        const sortedVariables = Object.values(metrics.variables || {}).sort(
          (a, b) =>
            Object.keys(b.products).length - Object.keys(a.products).length
        );

        // Populate variables distribution list
        const varListEl = document.getElementById("stats-variables-list");
        if (varListEl) {
          varListEl.innerHTML = sortedVariables
            .map(
              (v) => `
            <div class="stats-list-item">
              <i class="mdi mdi-circle-medium" style="color: var(--applications-color);"></i>
              <span>${v.name}: ${Object.keys(v.products).length} products</span>
            </div>
          `
            )
            .join("");
        }

        // Sort missions
        const sortedMissions = Object.values(metrics["eo-missions"] || {}).sort(
          (a, b) =>
            Object.keys(b.products).length - Object.keys(a.products).length
        );

        // Populate missions list
        const missionListEl = document.getElementById("stats-missions-list");
        if (missionListEl) {
          missionListEl.innerHTML = sortedMissions
            .map(
              (m) => `
            <div class="stats-list-item">
              <i class="mdi mdi-circle-medium" style="color: ${textToHex(
                m.name
              )};"></i>
              <span>${m.name}: ${Object.keys(m.products).length} products</span>
            </div>
          `
            )
            .join("");
        }

        // --- CONFIGURE EOX-CHARTS ---
        const productsChartEl = document.getElementById("productsChart");
        productsChartEl.opt = { renderer: "svg" };
        const yearsKeys = Object.keys(metrics.years || {});

        productsChartEl.spec = {
          $schema: "https://vega.github.io/schema/vega-lite/v5.json",
          data: {
            values: yearsKeys.map((year) => ({
              year: year,
              count: metrics.years[year],
            })),
          },
          mark: { type: "bar", color: "#00B19D" },
          encoding: {
            x: {
              field: "year",
              type: "ordinal",
              title: "Year",
              axis: {
                labelAngle: -45,
                labelOverlap: "greedy",
              },
            },
            y: {
              field: "count",
              type: "quantitative",
              title: "Number of products",
            },
            tooltip: [
              { field: "year", type: "ordinal", title: "Year" },
              {
                field: "count",
                type: "quantitative",
                title: "Number of products",
              },
            ],
          },
          config: {
            view: { stroke: null },
          },
        };

        const varColors = ["#00B19D"];
        const variableDataValues = sortedVariables.map((v) => {
          const count = Object.keys(v.products).length;
          const percent = metrics.numberOfProducts
            ? ((count * 100) / metrics.numberOfProducts).toFixed(2)
            : "0.00";
          return {
            name: v.name,
            count: count,
            count_label: `${count} products`,
            percent_label: `${percent}%`,
          };
        });

        const isMobile = window.innerWidth <= 960;
        const chartSize = isMobile ? 280 : 450;

        const variablePieEl = document.getElementById("variablePie");
        variablePieEl.opt = { renderer: "svg" };
        const defaultVarName = variableDataValues[0]
          ? variableDataValues[0].name
          : "";
        variablePieEl.spec = getDoughnutSpec(
          variableDataValues,
          varColors,
          defaultVarName,
          chartSize
        );

        const missionColors = sortedMissions.map((m) => textToHex(m.name));
        const missionDataValues = sortedMissions.map((m) => {
          const count = Object.keys(m.products).length;
          const percent = metrics.numberOfProducts
            ? ((count * 100) / metrics.numberOfProducts).toFixed(2)
            : "0.00";
          return {
            name: m.name,
            count: count,
            count_label: `${count} products`,
            percent_label: `${percent}%`,
          };
        });

        const missionPieEl = document.getElementById("missionPie");
        missionPieEl.opt = { renderer: "svg" };
        const defaultMissionName = missionDataValues[0]
          ? missionDataValues[0].name
          : "";
        missionPieEl.spec = getDoughnutSpec(
          missionDataValues,
          missionColors,
          defaultMissionName,
          chartSize
        );
      };

      setupModal(
        "modal-statistics",
        "btn-stats-open",
        ["btn-stats-close", "btn-stats-footer-close"],
        openStatisticsModal
      );

      // --- COVERAGE DIALOG POPULATION & EOX-MAP CONFIGURATION ---
      const createGeometry = (product) => {
        if (!product || !product.coverage || !product.coverage[0]) {
          return null;
        }
        const bbox = product.coverage[0];
        return {
          type: "Feature",
          id: product.id,
          properties: {
            product_id: product.id,
            name: product.name,
          },
          geometry: {
            type: "Polygon",
            coordinates: [
              [
                [bbox[0], bbox[1]],
                [bbox[2], bbox[1]],
                [bbox[2], bbox[3]],
                [bbox[0], bbox[3]],
                [bbox[0], bbox[1]],
              ],
            ],
          },
        };
      };

      const openCoverageModal = (variableId, productId = null) => {
        const modal = document.getElementById("modal-coverage");
        const modalTitle = document.getElementById("coverage-modal-title");
        const productsListEl = document.getElementById(
          "coverage-products-list"
        );
        const mapEl = document.getElementById("coverage-eox-map");

        // Set up layers dynamically if not already configured
        if (!mapEl.layers || mapEl.layers.length === 0) {
          mapEl.layers = [
            {
              type: "Tile",
              properties: { id: "terrain" },
              source: {
                type: "WMTSCapabilities",
                url: "https://tiles.maps.eox.at/wmts/1.0.0/WMTSCapabilities.xml",
                layer: "terrain-light_3857",
              },
            },
            {
              type: "Vector",
              properties: { id: "products", multipleFeatures: true },
              source: { type: "Vector" },
              style: {
                "stroke-color": "rgba(0, 50, 71, 0.5)",
                "stroke-width": 3,
                "fill-color": "rgba(0, 50, 71, 0.1)",
              },
              interactions: [
                {
                  type: "select",
                  options: {
                    id: "selectInteraction",
                    condition: "pointermove",
                    style: {
                      "stroke-color": "rgba(20, 100, 91, 1)",
                      "stroke-width": 3,
                      "fill-color": "rgba(0, 200, 71, 0.4)",
                    },
                  },
                },
              ],
            },
          ];
        }

        let productsToDisplay = [];
        if (productId) {
          // Single product mode
          const rawProd = products.find((p) => p.id === productId);
          if (!rawProd) return;
          const currentYears = {};
          if (
            rawProd.extent &&
            rawProd.extent.temporal &&
            rawProd.extent.temporal.interval &&
            rawProd.extent.temporal.interval[0]
          ) {
            const getYear = (string) => {
              if (!string) return null;
              return parseInt(string.substring(0, string.indexOf("-")));
            };
            const yearStart = getYear(rawProd.extent.temporal.interval[0][0]);
            const yearEnd = getYear(rawProd.extent.temporal.interval[0][1]);
            if (yearStart !== null && yearEnd !== null) {
              for (let year = yearStart; year <= yearEnd; year++) {
                currentYears[year] = 1;
              }
            }
          }
          const prod = {
            id: rawProd.id,
            name: rawProd.title,
            years: currentYears,
            coverage:
              rawProd.extent && rawProd.extent.spatial
                ? rawProd.extent.spatial.bbox
                : null,
            region: rawProd["osc:region"] || rawProd.region,
            missions: rawProd["osc:missions"] || [],
            project: rawProd["osc:project"] || rawProd.project,
          };
          modalTitle.textContent = `${prod.name} Coverage`;
          productsToDisplay = [prod];
        } else {
          // Variable mode
          const rowData = metrics[aggregationProperty][variableId];
          if (!rowData) return;
          modalTitle.textContent = `${rowData.name} Coverage`;
          productsToDisplay = Object.values(rowData.products || {});
        }

        // Alphabetical sort
        productsToDisplay.sort((a, b) =>
          a.name.localeCompare(b.name, "en", { sensitivity: "base" })
        );

        // Populate side panel product list
        productsListEl.innerHTML = productsToDisplay
          .map((prod) => {
            const isActive = productId ? prod.id === productId : false;
            const region = prod.region || "Global";
            const missions = prod.missions ? prod.missions.join(", ") : "None";

            return `
            <div class="cov-item ${isActive ? "active" : ""}" data-prod-id="${
              prod.id
            }">
              <div class="cov-item-name">${prod.name}</div>
              <div class="cov-item-meta">Region: ${region}</div>
              <div class="cov-item-meta">Missions: ${missions}</div>
              <div class="cov-item-actions">
                <button class="cov-btn highlight-btn" title="Highlight bounds on map" data-prod-id="${
                  prod.id
                }"><i class="mdi mdi-map-marker"></i></button>
                <a href="https://opensciencedata.esa.int/products/${
                  prod.id
                }/collection" target="_blank" class="cov-btn" title="Open Product Catalog Detail"><i class="mdi mdi-open-in-new"></i></a>
              </div>
            </div>
          `;
          })
          .join("");

        // Build features
        const features = [];
        productsToDisplay.forEach((prod) => {
          const geom = createGeometry(prod);
          if (geom) {
            features.push(geom);
          }
        });

        const geojson = {
          type: "FeatureCollection",
          features: features,
        };

        // Open Dialog
        modal.classList.add("open");

        // Parse features to eox-map
        setTimeout(() => {
          if (mapEl.map) {
            mapEl.map.updateSize();
          }
          const vectorLayer = mapEl.getLayerById("products");
          if (vectorLayer && features.length > 0) {
            mapEl.parseTextToFeature(
              JSON.stringify(geojson),
              vectorLayer,
              mapEl,
              true
            );
          }
        }, 120);

        // Bind clicking and hovering highlights
        productsListEl.onclick = (e) => {
          const item = e.target.closest(".cov-item");
          if (!item) return;
          const prodId = item.dataset.prodId;

          // Toggle active class
          productsListEl
            .querySelectorAll(".cov-item")
            .forEach((el) => el.classList.remove("active"));
          item.classList.add("active");

          const selectInteraction =
            mapEl.selectInteractions["selectInteraction"];
          if (selectInteraction) {
            const vectorLayer = mapEl.getLayerById("products");
            if (vectorLayer) {
              const features = vectorLayer.getSource().getFeatures();
              const feature = features.find(
                (f) => f.get("product_id") === prodId
              );

              if (feature) {
                const olId = feature.getId();
                selectInteraction.highlightById([olId], {
                  duration: 500,
                  padding: [50, 50, 50, 50],
                });
              }
            }
          }
        };

        productsListEl.onmouseover = (e) => {
          const item = e.target.closest(".cov-item");
          if (!item) return;
          const prodId = item.dataset.prodId;

          const selectInteraction =
            mapEl.selectInteractions["selectInteraction"];
          if (selectInteraction) {
            const vectorLayer = mapEl.getLayerById("products");
            if (vectorLayer) {
              const feature = vectorLayer
                .getSource()
                .getFeatures()
                .find((f) => f.get("product_id") === prodId);
              if (feature) {
                const olId = feature.getId();
                selectInteraction.highlightById([olId], {
                  duration: 300,
                  padding: [50, 50, 50, 50],
                });
              }
            }
          }
        };

        productsListEl.onmouseleave = () => {
          const selectInteraction =
            mapEl.selectInteractions["selectInteraction"];
          if (selectInteraction) {
            const activeItem = productsListEl.querySelector(".cov-item.active");
            if (activeItem) {
              const prodId = activeItem.dataset.prodId;
              const vectorLayer = mapEl.getLayerById("products");
              if (vectorLayer) {
                const feature = vectorLayer
                  .getSource()
                  .getFeatures()
                  .find((f) => f.get("product_id") === prodId);
                if (feature) {
                  const olId = feature.getId();
                  selectInteraction.highlightById([olId], {
                    duration: 300,
                    padding: [50, 50, 50, 50],
                  });
                  return;
                }
              }
            }

            selectInteraction.highlightById([], {});
            const vectorLayer = mapEl.getLayerById("products");
            if (vectorLayer) {
              const source = vectorLayer.getSource();
              if (source.getFeatures().length > 0) {
                mapEl.map.getView().fit(source.getExtent(), {
                  padding: [50, 50, 50, 50],
                  duration: 300,
                });
              }
            }
          }
        };
      };

      // Hook up coverage button handlers (delegate to tbody for dynamic elements)
      tbody.addEventListener("click", (e) => {
        const earthBtn = e.target.closest(
          "button.v-btn-icon-mock:not([disabled])"
        );
        if (earthBtn) {
          const parentRow = earthBtn.closest("tr.parent-row");
          if (parentRow) {
            const rowId = parentRow.dataset.id;
            openCoverageModal(rowId);
          }
        }

        const markerBtn = e.target.closest("button.cov-btn[title*='map']");
        if (markerBtn) {
          const prodId = markerBtn.dataset.prodId;
          openCoverageModal(null, prodId);
        }
      });

      setupModal("modal-coverage", null, [
        "btn-coverage-close",
        "btn-coverage-footer-close",
      ]);

      // --- ZOOM SLIDER BINDING (WITH EXACT ORIGINAL HIDE-EVEN CONDITIONAL CLASS) ---
      const zoomSlider = document.getElementById("zoom-slider");
      const root = document.documentElement;

      const tableContainer = document.querySelector(".metrics-table-container");
      const scrollToLatestYears = () => {
        if (tableContainer) {
          requestAnimationFrame(() => {
            tableContainer.scrollLeft = 10000;
          });
        }
      };

      const updateZoom = (val) => {
        zoomSlider.value = val;
        // Matches the original width scaling: Zoom 1 -> 28px, Zoom 2 -> 42px, Zoom 3 -> 56px per year column.
        // Prevents year label cut off as it scales dynamically based on the exact 28px minimum width!
        const zoomMap = { 1: "28px", 2: "42px", 3: "56px" };
        root.style.setProperty("--table-cell", zoomMap[val]);

        // Replicates EXACT conditional class from original view: :class="tableZoom < 3 ? 'hide-even' : ''"
        if (parseInt(val) < 3) {
          tableEl.classList.add("hide-even");
        } else {
          tableEl.classList.remove("hide-even");
        }

        // Add dynamic zoom-X class to main and nested tables to let spacer cells shrink adaptively when zoomed out!
        tableEl.classList.remove("zoom-1", "zoom-2", "zoom-3");
        tableEl.classList.add(`zoom-${val}`);

        document.querySelectorAll(".sub-products-table").forEach((subTable) => {
          subTable.classList.remove("zoom-1", "zoom-2", "zoom-3");
          subTable.classList.add(`zoom-${val}`);
        });

        // Auto-scroll to the end of the temporal timeline on zoom
        scrollToLatestYears();
      };

      zoomSlider.addEventListener("input", (e) => {
        updateZoom(e.target.value);
      });

      document
        .getElementById("zoom-out-trigger")
        .addEventListener("click", () => {
          const currentVal = parseInt(zoomSlider.value);
          if (currentVal > 1) updateZoom(currentVal - 1);
        });

      document
        .getElementById("zoom-in-trigger")
        .addEventListener("click", () => {
          const currentVal = parseInt(zoomSlider.value);
          if (currentVal < 3) updateZoom(currentVal + 1);
        });

      // Set initial zoom level
      updateZoom("1");

      // --- VERTICAL HOVER HIGH-FIDELITY TRACKING EFFECT (EXACTLY MATCHES ORIGINAL) ---
      const handleCellHover = (e) => {
        const cell = e.target.closest("td");
        if (!cell || cell.classList.contains("table-spacer-cell")) return; // Don't track spacer columns

        const parentRow = cell.parentNode;
        const allCells = Array.from(parentRow.children);
        const colIndex = allCells.indexOf(cell);

        // Remove hover class from all columns in both tables
        document
          .querySelectorAll(".hoverCell")
          .forEach((c) => c.classList.remove("hoverCell"));

        // Only apply vertical hover if we are inside a year cell (column index > 2 and < last-column - 1 to exclude spacer columns)
        if (colIndex > 2 && colIndex < allCells.length - 2) {
          // Add hover highlight to corresponding column cells of both main table and sub-tables
          document
            .querySelectorAll(
              `.metrics-table td:nth-child(${
                colIndex + 1
              }), .sub-products-table td:nth-child(${colIndex + 1})`
            )
            .forEach((c) => {
              c.classList.add("hoverCell");
            });
        }
      };

      const handleCellLeave = () => {
        document
          .querySelectorAll(".hoverCell")
          .forEach((c) => c.classList.remove("hoverCell"));
      };

      // Register vertical hover listeners
      tableEl.addEventListener("mouseover", handleCellHover);
      tableEl.addEventListener("mouseleave", handleCellLeave);

      // Show/Hide empty items toggle
      const emptyToggleBtn = document.getElementById("btn-toggle-empty");
      emptyToggleBtn.addEventListener("click", () => {
        const icon = emptyToggleBtn.querySelector("i");
        showEmptyItems = !showEmptyItems;
        if (showEmptyItems) {
          icon.className = "mdi mdi-archive-check-outline";
          emptyToggleBtn.title = `Hide empty ${aggregationProperty}`;
        } else {
          icon.className = "mdi mdi-archive-cancel-outline";
          emptyToggleBtn.title = `Show empty ${aggregationProperty}`;
        }
        updateView();
      });

      // Aggregation selector change
      const aggregationSelect = document.getElementById("aggregation-select");
      aggregationSelect.addEventListener("change", (e) => {
        aggregationProperty = e.target.value;
        allAggregationItems = null; // Reset static cache for new property

        // Update empty items toggle button tooltip
        if (showEmptyItems) {
          emptyToggleBtn.title = `Hide empty ${aggregationProperty}`;
        } else {
          emptyToggleBtn.title = `Show empty ${aggregationProperty}`;
        }

        updateView();
      });

      // Listen to filter events from EOx Itemfilter
      itemFilterEl.addEventListener("filter", (event) => {
        const results = event.detail.results;
        filteredProducts = results;
        metrics = createMetrics(results);
        updateView();
      });

      // --- INTERACTIVE ROW EXPAND/COLLAPSE FUNCTIONALITY ---
      tbody.addEventListener("click", (e) => {
        const btn = e.target.closest(".chevron-toggle");
        if (!btn) return;

        const parentRow = btn.closest("tr");
        const nextRow = parentRow.nextElementSibling;
        const icon = btn.querySelector("i");

        if (nextRow && nextRow.classList.contains("expanded-row")) {
          if (nextRow.style.display === "none") {
            nextRow.style.display = "table-row";
            icon.className = "mdi mdi-chevron-up";
          } else {
            nextRow.style.display = "none";
            icon.className = "mdi mdi-chevron-down";
          }
        }
      });

      let safetyTimeout;
      const hideLoader = () => {
        if (safetyTimeout) {
          clearTimeout(safetyTimeout);
          safetyTimeout = null;
        }
        const loadingOverlay = document.getElementById("loading-overlay");
        if (loadingOverlay) {
          loadingOverlay.classList.add("fade-out");
          setTimeout(() => {
            loadingOverlay.remove();
          }, 400);
        }
      };

      // Initial data fetching and page setup
      const init = async () => {
        safetyTimeout = setTimeout(hideLoader, 8000);
        try {
          await customElements.whenDefined("eox-itemfilter");
          products = await fetchProducts(API_URL);
          filteredProducts = [...products];

          // Bind items to filter component
          itemFilterEl.items = products;

          // Calculate initial metrics
          metrics = createMetrics(products);

          // Update view
          await updateView();

          // EOx itemfilter ready class
          itemFilterEl.classList.add("ready");
        } catch (err) {
          console.error("Initialization failed:", err);
        } finally {
          hideLoader();
        }
      };

      init();
    </script>
  </body>
</html>
