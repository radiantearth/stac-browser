name: Playwright Tests

on:
  push:
    branches:
        - main
        - v6
  pull_request:
    branches:
        - main
        - v6
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      playwright: ${{ steps.version.outputs.playwright }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Read Playwright version
      id: version
      run: echo "playwright=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # The image ships the browsers and system dependencies, its version must match the installed @playwright/test
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.version.outputs.playwright }}-noble
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 'lts/*'
    
    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run Playwright tests
      run: npx playwright test
      env:
        CI: true
     
    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: failure()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14
    
    - name: Upload test traces
      uses: actions/upload-artifact@v6
      if: failure()
      with:
        name: playwright-traces
        path: test-results/
        retention-days: 14
